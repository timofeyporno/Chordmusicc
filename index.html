<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Chordmusic</title>
<style>
  :root{
    --bg-black:#121212;
    --bg-dark:#191919;
    --bg-elevated:#242424;
    --bg-hover:#2a2a2a;
    --accent:#ff3b9d;
    --accent-hover:#ff5cab;
    --text-primary:#ffffff;
    --text-secondary:#b3b3b3;
    --sidebar-w:280px;
    --player-h:90px;
    --mini-h:64px;
    --tabbar-h:60px;
    --vh:1vh; /* переопределяется JS для iOS Safari */
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    background:var(--bg-black);
    color:var(--text-primary);
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
  }

  #appRoot{
    height:calc(var(--vh) * 100);
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#3a3a3a; border-radius:10px; }
  ::-webkit-scrollbar-thumb:hover{ background:#555; }

  button{ cursor:pointer; border:none; outline:none; background:none; font-family:inherit; color:inherit; -webkit-appearance:none; }

  .scroll-y{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  /* ---------- COVER + FALLBACK ---------- */
  .cover-wrap{
    position:relative;
    background:#2a2a2a;
    border-radius:6px;
    overflow:hidden;
    flex-shrink:0;
  }
  .cover-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .cover-wrap.cover-error img{ display:none; }
  .cover-wrap .note-fallback{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:linear-gradient(145deg,#2c2c2c,#1c1c1c);
  }
  .cover-wrap.cover-error .note-fallback,
  .cover-wrap.no-cover .note-fallback{ display:flex; }
  .cover-wrap.no-cover img{ display:none; }
  .note-fallback svg{ width:38%; height:38%; opacity:.55; }

  .cover-large{ width:100%; aspect-ratio:1/1; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.6); transition:transform .3s ease; }
  .cover-large.playing{ animation:pulseCover 3s ease-in-out infinite; }
  @keyframes pulseCover{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }

  /* ---------- LAYOUT (DESKTOP) ---------- */
  .app{
    display:flex;
    flex:1;
    min-height:0;
    padding-bottom:var(--player-h);
  }

  /* ---------- SIDEBAR / МЕДИАТЕКА ---------- */
  .sidebar{
    width:var(--sidebar-w);
    background:var(--bg-dark);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    border-radius:8px;
    margin:8px 0 8px 8px;
    overflow:hidden;
    min-height:0;
  }

  .sidebar-header{
    padding:22px 20px 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo{ display:flex; align-items:center; gap:10px; font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .logo span{ color:var(--accent); }

  .library-title{
    padding:14px 20px 8px;
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-secondary);
    display:flex; align-items:center; gap:8px;
  }

  .back-btn{
    display:flex; align-items:center; gap:6px;
    padding:4px 8px 4px 4px;
    color:var(--text-secondary);
    font-size:13px; font-weight:700;
    border-radius:6px;
  }
  .back-btn:hover{ color:var(--text-primary); background:var(--bg-hover); }

  .panel-body{ flex:1; min-height:0; padding:4px 8px 16px; }

  /* --- сетка плейлистов --- */
  .playlist-grid{ display:flex; flex-direction:column; gap:4px; }
  .playlist-card{
    display:flex; align-items:center; gap:12px;
    padding:8px 10px; border-radius:6px; cursor:pointer;
    transition:background .15s ease;
  }
  .playlist-card:hover{ background:var(--bg-hover); }
  .playlist-card .cover-wrap{ width:48px; height:48px; }
  .playlist-card .info .name{ font-size:14px; font-weight:600; }
  .playlist-card .info .count{ font-size:12px; color:var(--text-secondary); margin-top:2px; }

  .empty-hint{ text-align:center; color:var(--text-secondary); font-size:13px; padding:24px 16px; line-height:1.55; }

  /* --- список треков внутри плейлиста --- */
  .track-item{
    display:flex; align-items:center; gap:12px;
    padding:8px 10px; border-radius:6px; cursor:pointer;
    transition:background .15s ease; position:relative;
  }
  .track-item:hover{ background:var(--bg-hover); }
  .track-item.active{ background:var(--bg-elevated); }
  .track-item .cover-wrap{ width:44px; height:44px; }
  .track-item .meta{ display:flex; flex-direction:column; overflow:hidden; flex:1; }
  .track-item .title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-item.active .title{ color:var(--accent); }
  .track-item .artist{ font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  .eq{ width:16px; height:16px; flex-shrink:0; display:none; align-items:flex-end; gap:2px; }
  .track-item.active .eq{ display:flex; }
  .eq span{ width:3px; background:var(--accent); border-radius:2px; animation:eqBounce 1s ease-in-out infinite; }
  .eq span:nth-child(1){ height:6px; animation-delay:0s; }
  .eq span:nth-child(2){ height:14px; animation-delay:.2s; }
  .eq span:nth-child(3){ height:9px; animation-delay:.4s; }
  @keyframes eqBounce{ 0%,100%{ transform:scaleY(0.4); } 50%{ transform:scaleY(1); } }

  /* ---------- ГЛАВНАЯ ---------- */
  .main{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg, #1e1e1e 0%, var(--bg-black) 340px);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 24px 60px;
  }

  .mobile-home-header{ display:none; }

  .now-playing{ display:flex; flex-direction:column; align-items:center; text-align:center; max-width:420px; width:100%; margin:0 auto; }
  .now-playing .cover-large{ width:280px; }
  .now-playing .track-title{ font-size:28px; font-weight:800; margin-top:26px; letter-spacing:-0.5px; word-break:break-word; }
  .now-playing .track-artist{ font-size:16px; color:var(--text-secondary); margin-top:8px; font-weight:500; }
  .now-playing .track-playlist{ font-size:13px; color:var(--text-secondary); margin-top:2px; }

  .status-badge{
    margin-top:16px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    color:var(--accent); background:rgba(255,59,157,0.12); padding:6px 14px; border-radius:20px;
    display:none;
  }
  .status-badge.show{ display:inline-block; }

  .add-track-btn{
    margin-top:26px;
    padding:12px 22px;
    background:var(--accent);
    color:#121212;
    border-radius:30px;
    display:inline-flex; align-items:center; gap:8px;
    font-size:14px; font-weight:700;
    transition:transform .12s ease, background .15s ease;
  }
  .add-track-btn:hover{ background:var(--accent-hover); transform:scale(1.03); }
  #file-input{ display:none; }

  .home-section-title{ align-self:flex-start; margin:36px 0 12px; font-size:18px; font-weight:800; }
  .home-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; width:100%; }
  .home-card{ background:var(--bg-dark); border-radius:8px; padding:12px; cursor:pointer; transition:background .15s ease; }
  .home-card:hover{ background:var(--bg-elevated); }
  .home-card .cover-wrap{ width:100%; aspect-ratio:1/1; border-radius:6px; margin-bottom:10px; }
  .home-card .name{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .home-card .count{ font-size:11px; color:var(--text-secondary); margin-top:3px; }

  /* ---------- CONTROL BAR (DESKTOP, ФИКСИРОВАННЫЙ НИЗ) ---------- */
  .control-bar{
    position:fixed; bottom:0; left:0; right:0; height:var(--player-h);
    background:var(--bg-dark); border-top:1px solid #282828;
    display:flex; align-items:center; padding:0 16px; gap:16px; z-index:100;
  }
  .cb-track-info{ display:flex; align-items:center; gap:12px; width:280px; min-width:180px; overflow:hidden; }
  .cb-track-info .cover-wrap{ width:56px; height:56px; }
  .cb-track-info .meta{ overflow:hidden; }
  .cb-track-info .title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cb-track-info .artist{ font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  .cb-center{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; max-width:722px; margin:0 auto; }
  .cb-buttons{ display:flex; align-items:center; gap:20px; }
  .cb-buttons button{ color:var(--text-secondary); transition:color .15s ease, transform .1s ease; display:flex; align-items:center; justify-content:center; }
  .cb-buttons button:hover{ color:var(--text-primary); }
  .cb-buttons button.toggled{ color:var(--accent); }

  .play-btn{ width:34px; height:34px; background:var(--text-primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--bg-black); transition:transform .1s ease, background .15s ease; }
  .play-btn:hover{ transform:scale(1.06); background:#fff; }
  .play-btn svg{ margin-left:2px; }
  .play-btn.is-playing svg{ margin-left:0; }

  .cb-progress{ display:flex; align-items:center; gap:10px; width:100%; }
  .time{ font-size:11px; color:var(--text-secondary); min-width:38px; text-align:center; font-variant-numeric:tabular-nums; }

  .progress-track{ flex:1; height:4px; background:#4d4d4d; border-radius:2px; position:relative; cursor:pointer; padding:10px 0; margin:-10px 0; background-clip:content-box; }
  .progress-fill{ position:absolute; left:0; top:10px; height:4px; width:0%; background:var(--text-primary); border-radius:2px; pointer-events:none; }
  .progress-track:hover .progress-fill,
  .progress-track.dragging .progress-fill{ background:var(--accent); }
  .progress-thumb{ position:absolute; top:12px; width:12px; height:12px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); left:0%; opacity:0; transition:opacity .15s ease; box-shadow:0 1px 4px rgba(0,0,0,.4); pointer-events:none; }
  .progress-track:hover .progress-thumb,
  .progress-track.dragging .progress-thumb{ opacity:1; }

  .cb-right{ width:280px; min-width:160px; display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .volume-wrap{ display:flex; align-items:center; gap:8px; width:130px; }
  .volume-track{ flex:1; height:4px; background:#4d4d4d; border-radius:2px; position:relative; cursor:pointer; padding:10px 0; margin:-10px 0; }
  .volume-fill{ position:absolute; left:0; top:10px; height:4px; width:70%; background:var(--text-primary); border-radius:2px; pointer-events:none; }
  .volume-wrap:hover .volume-fill{ background:var(--accent); }
  .volume-thumb{ position:absolute; top:12px; width:12px; height:12px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); left:70%; opacity:0; transition:opacity .15s ease; pointer-events:none; }
  .volume-wrap:hover .volume-thumb{ opacity:1; }
  .icon-btn{ color:var(--text-secondary); display:flex; align-items:center; justify-content:center; transition:color .15s ease; }
  .icon-btn:hover{ color:var(--text-primary); }

  /* ---------- MOBILE MINI BAR ---------- */
  .mobile-mini-bar{
    display:none;
    position:fixed; left:0; right:0; bottom:var(--tabbar-h);
    height:var(--mini-h);
    background:var(--bg-elevated);
    border-top:1px solid #2f2f2f;
    align-items:center; gap:10px;
    padding:0 10px;
    z-index:150;
  }
  .mobile-mini-bar .mini-tap-area{ flex:1; display:flex; align-items:center; gap:10px; min-width:0; height:100%; }
  .mobile-mini-bar .cover-wrap{ width:44px; height:44px; }
  .mobile-mini-bar .meta{ overflow:hidden; }
  .mobile-mini-bar .title{ font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mobile-mini-bar .artist{ font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .mobile-mini-bar .mini-play-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-primary); flex-shrink:0; }
  .mobile-mini-progress{ position:absolute; top:0; left:0; height:2px; background:var(--accent); width:0%; }

  /* ---------- MOBILE TAB BAR ---------- */
  .mobile-tabbar{
    display:none;
    position:fixed; left:0; right:0; bottom:0;
    height:var(--tabbar-h);
    background:var(--bg-dark);
    border-top:1px solid #282828;
    align-items:stretch;
    z-index:150;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--text-secondary); font-size:11px; font-weight:600;
    min-height:44px;
  }
  .tab-btn.active{ color:var(--text-primary); }
  .tab-btn.active svg{ stroke:var(--accent); }
  .tab-btn svg{ transition:stroke .15s ease; }

  /* ---------- SOUNDCLOUD IMPORT ---------- */
  .soundcloud-import{
    width:min(520px,100%);
    margin:14px auto 0;
    display:flex;
    gap:8px;
    padding:6px;
    border:1px solid rgba(255,59,157,.18);
    background:rgba(255,255,255,.035);
    border-radius:14px;
    box-sizing:border-box;
  }
  .soundcloud-import input{
    min-width:0; flex:1; border:0; outline:0; background:transparent;
    color:var(--text-primary); padding:10px 10px; font:inherit; font-size:13px;
  }
  .soundcloud-import input::placeholder{color:var(--text-secondary)}
  .soundcloud-import button{
    border:0; border-radius:10px; padding:0 14px; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:800; font-size:12px;
  }
  .soundcloud-import button:active{transform:scale(.97)}
  .soundcloud-import-status{font-size:11px;color:var(--text-secondary);margin:8px auto 0;max-width:520px;text-align:center;min-height:16px}
  .soundcloud-widget-host{position:fixed;left:-20px;bottom:-20px;width:2px;height:2px;opacity:.01;pointer-events:none;overflow:hidden}
  .soundcloud-widget-host iframe{width:2px;height:2px;border:0}

  /* ---------- MOBILE PLAYER PANEL (полноэкранный) ---------- */
  .player-panel{
    display:none;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:28px 28px 20px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,#232323 0%, var(--bg-black) 400px);
  }
  .pp-top{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .pp-back{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); flex-shrink:0; }
  .pp-top .pp-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); font-weight:700; }

  .pp-cover-wrap{ width:100%; max-width:340px; margin:10px auto 30px; }
  .pp-cover-wrap .cover-wrap{ width:100%; aspect-ratio:1/1; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.6); }
  .pp-cover-wrap .cover-wrap.playing{ animation:pulseCover 3s ease-in-out infinite; }

  .pp-title{ font-size:24px; font-weight:800; text-align:center; word-break:break-word; }
  .pp-artist{ font-size:15px; color:var(--text-secondary); text-align:center; margin-top:6px; }

  .pp-progress{ display:flex; align-items:center; gap:10px; width:100%; margin-top:34px; }
  .pp-progress .progress-track{ flex:1; height:5px; padding:14px 0; margin:-14px 0; }
  .pp-progress .progress-fill{ top:14px; height:5px; }
  .pp-progress .progress-thumb{ top:16.5px; width:16px; height:16px; opacity:1; }

  .pp-buttons{ display:flex; align-items:center; justify-content:center; gap:26px; margin-top:22px; }
  .pp-buttons button{ color:var(--text-secondary); display:flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; }
  .pp-buttons button.toggled{ color:var(--accent); }
  .pp-play-btn{ width:66px; height:66px; background:var(--text-primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--bg-black); }
  .pp-play-btn svg{ margin-left:3px; }
  .pp-play-btn.is-playing svg{ margin-left:0; }
  .pp-side-btn svg{ width:24px; height:24px; }

  /* ---------- RESPONSIVE: MOBILE ---------- */
  @media (max-width:900px){
    .app{ padding-bottom:0; flex:1; }
    .control-bar{ display:none; }
    .sidebar{ display:none; width:100%; margin:0; border-radius:0; height:100%; }
    .main{ display:none; width:100%; }
    .player-panel{ display:none; }

    body.tab-home .main{ display:flex; }
    body.tab-library .sidebar{ display:flex; }
    body.tab-player .player-panel{ display:flex; }
    /* ФИКС: без этого .app остаётся flex:1 и пустой (сайдбар+главная скрыты),
       из-за чего сверху появляется чёрная пустая область, а панель плеера
       сжимается вниз и обрезается. На вкладке "Плеер" .app вообще не нужен. */
    body.tab-player .app{ display:none; }

    .mobile-mini-bar{ display:flex; }
    .mobile-tabbar{ display:flex; }
    body.tab-player .mobile-mini-bar{ display:none; }
    body:not(.has-track) .mobile-mini-bar{ display:none; }

    .app{ padding-bottom:0; }
    #appRoot{ padding-bottom:0; }

    .sidebar-header{ padding-top:calc(20px + env(safe-area-inset-top)); }
    .main{
      padding:calc(12px + env(safe-area-inset-top)) 18px 80px;
      background:linear-gradient(180deg,#171018 0%, var(--bg-black) 360px);
    }

    .mobile-home-header{
      width:100%;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      min-height:34px;
      margin-bottom:8px;
    }

    .mobile-brand{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--accent);
      font-size:15px;
      font-weight:800;
      letter-spacing:-.35px;
      padding:5px 0 5px 10px;
    }

    .mobile-brand svg{
      flex-shrink:0;
      filter:drop-shadow(0 0 7px rgba(255,59,157,.28));
    }

    .mobile-brand span{ color:#fff; }
    .player-panel{ padding-top:calc(20px + env(safe-area-inset-top)); }

    /* крупные тач-таргеты */
    .track-item, .playlist-card, .home-card{ min-height:44px; }
    .add-track-btn{ padding:14px 26px; font-size:15px; }
  }

  @media (min-width:901px){
    .mobile-mini-bar, .mobile-tabbar, .player-panel{ display:none !important; }
  }
</style>
</head>
<body class="tab-home">

<div id="appRoot">
  <div class="app">

    <!-- SIDEBAR / МЕДИАТЕКА -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M2 16.5h3l2-6 3.2 12 3.1-17 3.1 11 2.1-6 2.1 4h5.4" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>chordmusic</span>
        </div>
      </div>

      <div class="library-title" id="libraryHeader">
        <span id="libraryHeaderText">Медиатека</span>
      </div>

      <div class="panel-body scroll-y" id="libraryPanelBody"></div>
    </aside>

    <!-- ГЛАВНАЯ -->
    <main class="main" id="mainHome">
      <div class="mobile-home-header" aria-label="Chordmusic">
        <div class="mobile-brand">
          <svg width="25" height="25" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M2 16.5h3l2-6 3.2 12 3.1-17 3.1 11 2.1-6 2.1 4h5.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>chordmusic</span>
        </div>
      </div>
      <div class="now-playing">
        <div class="cover-wrap cover-large no-cover" id="heroCoverWrap">
          <img id="heroCoverImg" src="" alt="" onerror="handleCoverError(this)">
          <div class="note-fallback">{{NOTE_SVG}}</div>
        </div>
        <h1 class="track-title" id="heroTitle">Выберите трек</h1>
        <p class="track-artist" id="heroArtist">Добавьте плейлист в MUSIC_LIBRARY или загрузите свои MP3</p>
        <p class="track-playlist" id="heroPlaylist"></p>
        <div class="status-badge" id="statusBadge">Сейчас играет</div>

        <label class="add-track-btn" for="file-input">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#121212" stroke-width="2.5" stroke-linecap="round"/></svg>
          Добавить свои MP3
        </label>
        <input type="file" id="file-input" multiple accept="audio/*,.mp3">

        <div class="soundcloud-import" aria-label="Импорт трека из SoundCloud">
          <input id="soundcloudUrlInput" type="url" inputmode="url"
                 placeholder="Вставь ссылку SoundCloud…"
                 autocomplete="off" spellcheck="false">

<script>
(function(){

  /* =======================================================================
     1. БИБЛИОТЕКА ТРЕКОВ — ЕДИНАЯ ТОЧКА НАСТРОЙКИ.
     Впишите сюда свои плейлисты/альбомы. Каждый объект — это плейлист:
       playlistName  — название, которое увидит пользователь
       coverUrl      — одна обложка на весь плейлист (относительный путь или URL)
       tracksFolder  — папка на GitHub, где лежат mp3-файлы (со слэшем в конце)
       tracks        — список треков: { file, title, artist }
     Итоговый путь к файлу собирается автоматически: tracksFolder + file.

     Пример (раскомментируйте и замените на свои данные):

     const MUSIC_LIBRARY = [
       {
         playlistName: "Мой альбом",
         coverUrl: "music/album1/cover.jpg",
         tracksFolder: "music/album1/",
         tracks: [
           { file: "track1.mp3", title: "Название песни 1", artist: "Исполнитель 1" },
           { file: "track2.mp3", title: "Название песни 2", artist: "Исполнитель 2" }
         ]
       }
     ];
  ========================================================================== */
  /* Каждый трек можно описать всего одним полем "file" — название, исполнитель
     и обложка будут автоматически прочитаны из ID3-тегов самого mp3-файла
     (обложка вытаскивается из встроенного APIC-кадра). Явно указанные
     playlistName/coverUrl/title/artist имеют приоритет и не перезаписываются.

     const MUSIC_LIBRARY = [
       {
         playlistName: "Мой альбом",
         tracksFolder: "music/album1/",
         tracks: [
           { file: "track1.mp3" },              // всё подтянется из тегов файла
           { file: "track2.mp3", artist: "..." } // а тут исполнитель задан вручную
         ]
       }
     ];
  */

const MUSIC_LIBRARY = [
  {
    playlistName: "Unrelease CUPSIZE",
    tracksFolder: "cupsize/",
    coverUrl: "",
    tracks: [
      { file: "антидипрессанты.mp3" },
      { file: "1783446441_CUPSIZE_только_не_делай_фото_snippet_07_07_26.mp3"}
    ]
  },
  {
    playlistName: "неуравновешеннолетниепесни Pt.1",
    tracksFolder: "cupsize/alb5/",
    coverUrl: "",
    tracks: [
      { file: "song1.mp3" },
      { file: "song2.mp3" },
      { file: "song3.mp3" },
      { file: "song4.mp3" },
      { file: "song5.mp3" },
      { file: "song6.mp3" },
      { file: "song7.mp3" }
    ]
  },
  {
    playlistName: "в моих легких выросли цветы",
    tracksFolder: "cupsize/alb4/",
    coverUrl: "",
    tracks: [
      { file: "track1.mp3" },
      { file: "track2.mp3" },
      { file: "track3.mp3" },
      { file: "track4.mp3" },
      { file: "track5.mp3" },
      { file: "track6.mp3" },
      { file: "track7.mp3" },
      { file: "track8.mp3" },
      { file: "track9.mp3" },
      { file: "track10.mp3" }
    ]
  }
];

  /* ======================= АВТО-ЧТЕНИЕ ID3-ТЕГОВ (ОБЛОЖКА/НАЗВАНИЕ/ИСПОЛНИТЕЛЬ) =======================
     Простой парсер ID3v2.2/2.3/2.4, читает текстовые фреймы (TIT2/TPE1) и обложку (APIC/PIC).
     Не тянет внешние библиотеки — работает по сырым байтам файла. */
  const ID3_SNIFF_BYTES = 3 * 1024 * 1024; // сколько байт с начала файла читаем (обложки почти всегда в первых мегабайтах)

  function readSynchsafeInt(bytes, offset){
    return ((bytes[offset] & 0x7f) << 21) | ((bytes[offset+1] & 0x7f) << 14) |
           ((bytes[offset+2] & 0x7f) << 7) | (bytes[offset+3] & 0x7f);
  }
  function readUInt32BE(bytes, offset){
    return ((bytes[offset] << 24) | (bytes[offset+1] << 16) | (bytes[offset+2] << 8) | bytes[offset+3]) >>> 0;
  }
  function decodeLatin1(bytes){
    let s = '';
    for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return s;
  }
  function decodeTextFrame(data){
    if(!data || data.length === 0) return '';
    const encoding = data[0];
    const body = data.subarray(1);
    let text = '';
    try{
      if(encoding === 3){ text = new TextDecoder('utf-8').decode(body); }
      else if(encoding === 1){
        const isLE = !(body[0] === 0xFE && body[1] === 0xFF);
        text = new TextDecoder(isLE ? 'utf-16le' : 'utf-16be').decode(body.subarray(2));
      } else if(encoding === 2){
        text = new TextDecoder('utf-16be').decode(body);
      } else {
        text = decodeLatin1(body);
      }
    }catch(e){ text = decodeLatin1(body); }
    return text.replace(/\u0000+$/,'').trim();
  }
  function parsePictureFrame(data, isV22){
    let i = 0;
    const textEncoding = data[i]; i += 1;
    let mime;
    if(isV22){
      mime = 'image/' + decodeLatin1(data.subarray(i, i+3)).toLowerCase().replace('jpg','jpeg');
      i += 3;
    } else {
      let mimeEnd = i;
      while(mimeEnd < data.length && data[mimeEnd] !== 0) mimeEnd++;
      mime = decodeLatin1(data.subarray(i, mimeEnd)) || 'image/jpeg';
      i = mimeEnd + 1;
    }
    i += 1; // picture type byte
    if(textEncoding === 1 || textEncoding === 2){
      while(i < data.length - 1 && !(data[i] === 0 && data[i+1] === 0)) i += 2;
      i += 2;
    } else {
      while(i < data.length && data[i] !== 0) i += 1;
      i += 1;
    }
    const imageData = data.subarray(i);
    if(imageData.length < 100) return null; // подозрительно маленькое — не картинка
    const blob = new Blob([imageData], { type: mime });
    return URL.createObjectURL(blob);
  }

  /** Парсит ID3v2-теги из ArrayBuffer. Возвращает {title, artist, album, coverUrl} — поля отсутствуют, если не найдены. */
  function parseID3(arrayBuffer){
    const result = {};
    try{
      const bytes = new Uint8Array(arrayBuffer);
      if(bytes.length < 10 || bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return result; // нет "ID3"
      const majorVersion = bytes[3];
      const flags = bytes[5];
      const tagSize = readSynchsafeInt(bytes, 6);
      let offset = 10;
      if(flags & 0x40){ // extended header
        const extSize = majorVersion === 4 ? readSynchsafeInt(bytes, offset) : readUInt32BE(bytes, offset);
        offset += extSize;
      }
      const end = Math.min(bytes.length, 10 + tagSize);
      const isV22 = majorVersion === 2;

      while(offset < end - (isV22 ? 6 : 10)){
        let frameId, frameSize;
        if(isV22){
          frameId = decodeLatin1(bytes.subarray(offset, offset+3));
          frameSize = (bytes[offset+3]<<16)|(bytes[offset+4]<<8)|bytes[offset+5];
          offset += 6;
        } else {
          frameId = decodeLatin1(bytes.subarray(offset, offset+4));
          frameSize = majorVersion === 4 ? readSynchsafeInt(bytes, offset+4) : readUInt32BE(bytes, offset+4);
          offset += 10;
        }
        if(!frameId || frameId.charCodeAt(0) === 0 || frameSize <= 0 || offset + frameSize > bytes.length) break;

        const frameData = bytes.subarray(offset, offset + frameSize);
        if(frameId === 'TIT2' || frameId === 'TT2'){ result.title = decodeTextFrame(frameData) || result.title; }
        else if(frameId === 'TPE1' || frameId === 'TP1'){ result.artist = decodeTextFrame(frameData) || result.artist; }
        else if(frameId === 'TALB' || frameId === 'TAL'){ result.album = decodeTextFrame(frameData) || result.album; }
        else if(frameId === 'APIC' || frameId === 'PIC'){
          const pic = parsePictureFrame(frameData, isV22);
          if(pic) result.coverUrl = pic;
        }
        offset += frameSize;
      }
    }catch(e){ console.warn('Не удалось разобрать ID3-теги:', e); }
    return result;
  }

  /** Читает первые ID3_SNIFF_BYTES файла (локального File или удалённого URL) и возвращает parseID3(). */
  async function sniffID3(source){
    try{
      let buffer;
      if(source instanceof File){
        buffer = await source.slice(0, ID3_SNIFF_BYTES).arrayBuffer();
      } else {
        const res = await fetch(source, { headers: { Range: `bytes=0-${ID3_SNIFF_BYTES - 1}` } });
        if(!res.ok && res.status !== 206) return {};
        buffer = await res.arrayBuffer();
      }
      return parseID3(buffer);
    }catch(e){ console.warn('Не удалось прочитать теги файла', source, e); return {}; }
  }

  /* ======================= СЛУЖЕБНЫЕ ИКОНКИ ======================= */
  const NOTE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';

  // Заменяем плейсхолдеры обложек-заглушек на реальные SVG (чтобы не дублировать разметку руками)
  document.querySelectorAll('.note-fallback').forEach(el => {
    if(el.innerHTML.indexOf('{{NOTE_SVG') !== -1) el.innerHTML = NOTE_SVG;
  });

  window.handleCoverError = function(imgEl){
    const wrap = imgEl.closest('.cover-wrap');
    if(wrap) wrap.classList.add('cover-error');
  };

  function coverWrapHTML(url, extraClass){
    const noCover = !url;
    return `<div class="cover-wrap ${extraClass||''} ${noCover ? 'no-cover' : ''}">` +
             (noCover ? '' : `<img src="${escapeAttr(url)}" alt="" onerror="handleCoverError(this)">`) +
             `<div class="note-fallback">${NOTE_SVG}</div>` +
           `</div>`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

  /* ======================= ПОСТРОЕНИЕ ВНУТРЕННЕЙ БИБЛИОТЕКИ ======================= */
  let library = MUSIC_LIBRARY.map((pl, i) => buildPlaylist(pl, 'lib-' + i));
  let localPlaylist = null; // создаётся при добавлении своих файлов

  function buildPlaylist(pl, id){
    const built = {
      id: id,
      playlistName: pl.playlistName,
      coverUrl: pl.coverUrl || null,
      isLocal: false,
      tracks: (pl.tracks || []).map(t => ({
        title: t.title || t.file,
        artist: t.artist || 'Неизвестный исполнитель',
        coverUrl: t.coverUrl || null,
        src: (pl.tracksFolder || '') + t.file,
        _needsTagSniff: !t.title || !t.artist || !t.coverUrl
      }))
    };
    built.tracks.forEach(track => {
      if(track._needsTagSniff) enrichTrackFromTags(built, track);
    });
    return built;
  }

  /** Асинхронно докачивает недостающие название/исполнителя/обложку из ID3-тегов файла и обновляет UI. */
  function enrichTrackFromTags(pl, track){
    sniffID3(track.src).then(tags => {
      let changed = false;
      if(!track.title || track.title === track.src.split('/').pop()){
        if(tags.title){ track.title = tags.title; changed = true; }
      }
      if((!track.artist || track.artist === 'Неизвестный исполнитель') && tags.artist){ track.artist = tags.artist; changed = true; }
      if(!track.coverUrl && tags.coverUrl){ track.coverUrl = tags.coverUrl; changed = true; }
      if(changed){
        renderHomeGrid();
        renderLibraryPanel();
        refreshNowPlayingIfCurrent(pl, track);
      }
    });
  }

  /** Если сейчас играет именно этот трек — обновляем обложку/текст в плеере без перезапуска воспроизведения. */
  function refreshNowPlayingIfCurrent(pl, track){
    const curPl = getPlaylistById(currentPlaylistId);
    if(!curPl || curPl.id !== pl.id) return;
    if(curPl.tracks[currentIndex] !== track) return;

    setCoverEverywhere(trackCover(track, curPl));
    setTextEverywhere(track.title, track.artist, curPl.playlistName);

    // ID3-обложка/название могли загрузиться уже после начала воспроизведения.
    updateIOSMediaSession(track, curPl);
  }

  /* ======================= iOS / SAFARI MEDIA SESSION ======================= */
  // Полностью синхронизирует Chordmusic с системным плеером iOS:
  // экран блокировки, Control Center, AirPods и Bluetooth-кнопки.
  const IOS_MEDIA_ACTIONS = [
    'play', 'pause', 'previoustrack', 'nexttrack',
    'seekbackward', 'seekforward', 'seekto'
  ];

  function hasIOSMediaSession(){
    return typeof navigator !== 'undefined' &&
           'mediaSession' in navigator &&
           typeof window !== 'undefined';
  }

  function mediaArtworkType(src){
    if(!src || typeof src !== 'string') return undefined;

    // Для встроенной APIC-картинки MIME уже лежит в data URL.
    const dataMatch = src.match(/^data:([^;,]+)[;,]/i);
    if(dataMatch) return dataMatch[1];

    const clean = src.split('?')[0].split('#')[0].toLowerCase();
    if(clean.endsWith('.png')) return 'image/png';
    if(clean.endsWith('.webp')) return 'image/webp';
    if(clean.endsWith('.gif')) return 'image/gif';
    if(clean.endsWith('.jpg') || clean.endsWith('.jpeg')) return 'image/jpeg';
    return undefined;
  }

  function updateIOSMediaSession(track, pl){
    if(!hasIOSMediaSession() || !track) return;

    const title = String(track.title || 'Без названия');
    const artist = String(track.artist || 'Неизвестный исполнитель');
    const album = String((pl && pl.playlistName) || 'Chordmusic');
    const artwork = trackCover(track, pl);

    try {
      const artworkItems = artwork ? [{
        src: artwork,
        sizes: '512x512',
        ...(mediaArtworkType(artwork) ? { type: mediaArtworkType(artwork) } : {})
      }] : [];

      navigator.mediaSession.metadata = new MediaMetadata({
        title,
        artist,
        album,
        artwork: artworkItems
      });
    } catch(err) {
      console.warn('Не удалось обновить Media Session metadata:', err);
    }
  }

  function clearIOSMediaSession(){
    if(!hasIOSMediaSession()) return;

    try {
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.playbackState = 'none';
    } catch(err) {
      console.warn('Не удалось очистить Media Session:', err);
    }
  }

  function updateIOSMediaPosition(){
    if(!hasIOSMediaSession()) return;

    const duration = Number(audio.duration);
    const position = Number(audio.currentTime);
    const rate = Number(audio.playbackRate) || 1;

    // Safari бросает исключение, если duration/position невалидны.
    if(!Number.isFinite(duration) || duration <= 0) return;
    if(!Number.isFinite(position) || position < 0) return;

    const safePosition = Math.min(position, duration);

    try {
      if(typeof navigator.mediaSession.setPositionState === 'function'){
        navigator.mediaSession.setPositionState({
          duration,
          playbackRate: rate,
          position: safePosition
        });
      }
    } catch(err) {
      // Старые версии Safari могут не поддерживать setPositionState.
    }
  }

  function setIOSPlaybackState(state){
    if(!hasIOSMediaSession()) return;
    try {
      navigator.mediaSession.playbackState = state;
    } catch(err) {}
  }

  function setIOSMediaAction(action, handler){
    if(!hasIOSMediaSession() || typeof navigator.mediaSession.setActionHandler !== 'function') return;
    try {
      navigator.mediaSession.setActionHandler(action, handler);
    } catch(err) {
      // Конкретная версия Safari может не поддерживать отдельный action.
    }
  }

  function setupIOSMediaSession(){
    if(!hasIOSMediaSession()) return;

    setIOSMediaAction('play', () => {
      playAudio();
    });

    setIOSMediaAction('pause', () => {
      pauseAudio();
    });

    setIOSMediaAction('previoustrack', () => {
      playPrev();
    });

    setIOSMediaAction('nexttrack', () => {
      playNext(true);
    });

    setIOSMediaAction('seekbackward', (details) => {
      const offset = Number(details && details.seekOffset) || 10;
      if(soundCloudMode && soundCloudWidget && soundCloudReady){
        soundCloudWidget.getPosition(function(ms){ soundCloudWidget.seekTo(Math.max(0, ms - offset * 1000)); });
      } else {
        audio.currentTime = Math.max(0, audio.currentTime - offset);
        updateIOSMediaPosition();
      }
    });

    setIOSMediaAction('seekforward', (details) => {
      const offset = Number(details && details.seekOffset) || 10;
      const duration = Number(audio.duration);
      if(soundCloudMode && soundCloudWidget && soundCloudReady){
        soundCloudWidget.getPosition(function(ms){ soundCloudWidget.getDuration(function(total){ soundCloudWidget.seekTo(Math.min(total || Infinity, ms + offset * 1000)); }); });
      } else {
        audio.currentTime = Number.isFinite(duration) && duration > 0
          ? Math.min(duration, audio.currentTime + offset)
          : audio.currentTime + offset;
        updateIOSMediaPosition();
      }
    });

    setIOSMediaAction('seekto', (details) => {
      if(!details || !Number.isFinite(Number(details.seekTime))) return;

      const duration = Number(audio.duration);
      let target = Math.max(0, Number(details.seekTime));

      if(Number.isFinite(duration) && duration > 0){
        target = Math.min(duration, target);
      }

      if(soundCloudMode && soundCloudWidget && soundCloudReady) soundCloudWidget.seekTo(target * 1000);
      else { audio.currentTime = target; updateIOSMediaPosition(); }
    });
  }

  function trackWord(n){
    const mod10 = n % 10, mod100 = n % 100;
    if(mod10 === 1 && mod100 !== 11) return 'трек';

    return 'треков';
  }

  /* ======================= SOUNDCLOUD ======================= */
  function isSoundCloudUrl(value){
    try{
      const u = new URL(value);
      return /(^|\.)soundcloud\.com$/i.test(u.hostname) || /(^|\.)on\.soundcloud\.com$/i.test(u.hostname);
    }catch(e){ return false; }
  }

  function setSoundCloudStatus(text, isError=false){
    soundcloudStatus.textContent = text || '';
    soundcloudStatus.style.color = isError ? '#ff6b9f' : '';

  function destroySoundCloudWidget(){
    soundCloudReady = false;
    soundCloudTrack = null;
    soundCloudWidget = null;
    soundCloudMode = false;
    soundcloudWidgetHost.innerHTML = '';
  }

  function updateSoundCloudPosition(positionMs, durationMs){
    const duration = Number(durationMs) / 1000;
    const position = Number(positionMs) / 1000;
    if(!Number.isFinite(duration) || duration <= 0 || !Number.isFinite(position)) return;
    const pct = Math.min(100, Math.max(0, position / duration * 100));
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    ppProgressFill.style.width = pct + '%';
    ppProgressThumb.style.left = pct + '%';
    miniProgress.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(position);
    ppCurrentTime.textContent = formatTime(position);
    durationTimeEl.textContent = formatTime(duration);
    ppDurationTime.textContent = formatTime(duration);
    updateIOSMediaPositionForValues(position, duration);
  }

  function updateIOSMediaPositionForValues(position, duration){
    if(!hasIOSMediaSession() || !Number.isFinite(duration) || duration <= 0) return;
    try{
      if(typeof navigator.mediaSession.setPositionState === 'function'){
        navigator.mediaSession.setPositionState({duration, playbackRate:1, position:Math.min(position,duration)});
      }
    }catch(e){}
  }

  function updateSoundCloudMetadata(sound){
    if(!sound) return;
    soundCloudTrack = sound;
    const title = String(sound.title || 'SoundCloud track');
    const artist = String(sound.user && sound.user.username || 'SoundCloud');
    let artwork = sound.artwork_url || sound.user?.avatar_url || '';
    if(artwork) artwork = artwork.replace('-large.', '-t500x500.').replace('-large', '-t500x500');

    setCoverEverywhere(artwork || '');
    setTextEverywhere(title, artist, 'SoundCloud');
    document.body.classList.add('has-track');
    if(hasIOSMediaSession()){
      try{
        navigator.mediaSession.metadata = new MediaMetadata({
          title, artist, album:'SoundCloud',
          artwork: artwork ? [{src:artwork, sizes:'500x500', type:'image/jpeg'}] : []
        });
      }catch(e){}
    }
  }

  function setupSoundCloudWidget(url, autoplay=true){
    if(!window.SC || !SC.Widget){
      setSoundCloudStatus('SoundCloud API не загрузился. Проверь интернет.', true);
      return;
    }

    destroySoundCloudWidget();
    soundCloudMode = true;
    soundCloudUrl = url;
    setSoundCloudStatus('Подключаю трек…');

    const iframe = document.createElement('iframe');
    iframe.allow = 'autoplay';
    iframe.setAttribute('scrolling','no');
    iframe.setAttribute('frameborder','no');
    iframe.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
      '&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false&color=ff3b9d';
    soundcloudWidgetHost.appendChild(iframe);

    soundCloudWidget = SC.Widget(iframe);

    soundCloudWidget.bind(SC.Widget.Events.READY, function(){
      soundCloudReady = true;
      setSoundCloudStatus('');
      soundCloudWidget.getCurrentSound(function(sound){
        updateSoundCloudMetadata(sound);
        if(autoplay) soundCloudWidget.play();
      });
    });

    soundCloudWidget.bind(SC.Widget.Events.PLAY, function(){
      isPlaying = true;
      setIOSPlaybackState('playing');
      updatePlayUI();
      setSoundCloudStatus('');
    });

    soundCloudWidget.bind(SC.Widget.Events.PAUSE, function(){
      isPlaying = false;
      setIOSPlaybackState('paused');
      updatePlayUI();
    });

    soundCloudWidget.bind(SC.Widget.Events.PLAY_PROGRESS, function(data){
      updateSoundCloudPosition(data.currentPosition, data.duration);
    });

    soundCloudWidget.bind(SC.Widget.Events.FINISH, function(){
      isPlaying = false;
      setIOSPlaybackState('paused');
      updatePlayUI();
      if(repeatMode === 2){ soundCloudWidget.seekTo(0); soundCloudWidget.play(); }
    });

    soundCloudWidget.bind(SC.Widget.Events.ERROR, function(){
      isPlaying = false;
      updatePlayUI();
      setSoundCloudStatus('SoundCloud не может воспроизвести этот трек.', true);
    });
  }

  function loadSoundCloudFromInput(){
    const url = soundcloudUrlInput.value.trim();

  /* ======================= ВОСПРОИЗВЕДЕНИЕ ======================= */
  function playTrackInPlaylist(playlistId, index){
    if(soundCloudMode) destroySoundCloudWidget();
    const pl = getPlaylistById(playlistId);
    if(!pl || !pl.tracks[index]) return;
    currentPlaylistId = playlistId;
    currentIndex = index;

  function loadCurrentTrack(){
    const pl = getPlaylistById(currentPlaylistId);
    if(!pl) return;
    const track = pl.tracks[currentIndex];
    if(!track) return;

    audio.src = track.src;
    document.body.classList.add('has-track');

    // обложка/название/исполнитель — обновляем везде (обложка трека приоритетнее обложки плейлиста)
    setCoverEverywhere(trackCover(track, pl));
    setTextEverywhere(track.title, track.artist, pl.playlistName);

    // Системный плеер iOS получает реальные title/artist/album/artwork.
    updateIOSMediaSession(track, pl);

    renderLibraryPanel();
    resetProgressEverywhere();
  }

  function setCoverEverywhere(url){
    [
      [heroCoverWrap, heroCoverImg],
      [cbCoverWrap, cbCoverImg],
      [miniCoverWrap, miniCoverImg],
      [ppCoverWrap, ppCoverImg]

  function playAudio(){
    if(soundCloudMode && soundCloudWidget && soundCloudReady){
      soundCloudWidget.play();
      return;
    }
    if(!audio.src) return;

    const p = audio.play();
    if(p && p.then){
      p.then(() => {
        isPlaying = true;
        setIOSPlaybackState('playing');
        updateIOSMediaPosition();
        updatePlayUI();
      }).catch(err => console.warn('Не удалось воспроизвести:', err));
    } else {
      isPlaying = true;
      setIOSPlaybackState('playing');
      updateIOSMediaPosition();
      updatePlayUI();
    }
  }

  function pauseAudio(){
    if(soundCloudMode && soundCloudWidget && soundCloudReady){
      soundCloudWidget.pause();
      return;
    }
    audio.pause();
    isPlaying = false;
    setIOSPlaybackState('paused');
    updateIOSMediaPosition();
    updatePlayUI();
  }
  function togglePlay(){
    if(soundCloudMode){ isPlaying ? pauseAudio() : playAudio(); return; }
    if(!audio.src) return;
    isPlaying ? pauseAudio() : playAudio();
  }

  function updatePlayUI(){
    [playIcon, miniPlayIcon, ppPlayIcon].forEach(icon => {
      icon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    });
    playBtn.classList.toggle('is-playing', isPlaying);
    ppPlayBtn.classList.toggle('is-playing', isPlaying);
    heroCoverWrap.classList.toggle('playing', isPlaying);
    ppCoverWrap.classList.toggle('playing', isPlaying);
    statusBadge.classList.toggle('show', isPlaying);

    document.querySelectorAll('.track-item').forEach(el => {
      const isCurrent = detailPlaylistId === currentPlaylistId && Number(el.dataset.idx) === currentIndex;
      el.classList.toggle('active', isCurrent);
    });
  }

  function getCurrentQueue(){
    const pl = getPlaylistById(currentPlaylistId);
    return pl ? pl.tracks : [];
  }

  function playNext(userTriggered){
    if(soundCloudMode){
      if(soundCloudWidget && soundCloudReady && userTriggered){
        setSoundCloudStatus('Для ссылки SoundCloud доступен один трек.');
      }
      return;
    }
    const queue = getCurrentQueue();
    if(queue.length === 0) return;
    let nextIndex;
    if(isShuffle){
      if(queue.length === 1) nextIndex = 0;
      else { do { nextIndex = Math.floor(Math.random()*queue.length); } while(nextIndex === currentIndex); }
    } else {
      nextIndex = currentIndex + 1;
      if(nextIndex >= queue.length){
        nextIndex = 0;
        if(!userTriggered && repeatMode !== 1){
          currentIndex = nextIndex;
          loadCurrentTrack();
          pauseAudio();
          return;
        }
      }
    }
    currentIndex = nextIndex;
    loadCurrentTrack();
    playAudio();
  }

  function playPrev(){
    if(soundCloudMode){
      if(soundCloudWidget && soundCloudReady){ soundCloudWidget.seekTo(0); soundCloudWidget.play(); }
      return;
    }
    const queue = getCurrentQueue();
    if(queue.length === 0) return;
    if(audio.currentTime > 3){ audio.currentTime = 0; return; }
    let prevIndex = currentIndex - 1;
    if(prevIndex < 0) prevIndex = queue.length - 1;
    currentIndex = prevIndex;
    loadCurrentTrack();
    playAudio();
  }

  /* ======================= ПРОГРЕСС-БАР (десктоп + мобильный плеер) ======================= */
  function formatTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }

  audio.addEventListener('timeupdate', () => {
    if(!isSeeking) updateIOSMediaPosition();
    if(isSeeking || !audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%'; progressThumb.style.left = pct + '%';
    ppProgressFill.style.width = pct + '%'; ppProgressThumb.style.left = pct + '%';
    miniProgress.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    ppCurrentTime.textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    durationTimeEl.textContent = formatTime(audio.duration);
    ppDurationTime.textContent = formatTime(audio.duration);
    updateIOSMediaPosition();
  });

  audio.addEventListener('play', () => {
    isPlaying = true;
    setIOSPlaybackState('playing');
    updatePlayUI();
  });

  audio.addEventListener('pause', () => {
    isPlaying = false;
    setIOSPlaybackState('paused');
    updatePlayUI();
  });

  audio.addEventListener('ratechange', () => {
    updateIOSMediaPosition();
  });

  audio.addEventListener('ended', () => {
    if(repeatMode === 2){ audio.currentTime = 0; playAudio(); }
    else { playNext(false); }
  });

  function setupSeekableBar(trackEl, fillEl, thumbEl, curEl){
    let seeking = false;
    function seekTo(clientX){
      const rect = trackEl.getBoundingClientRect();
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.min(1, Math.max(0, pct));
      if(soundCloudMode && soundCloudWidget && soundCloudReady){
        const durationMs = Number(audio.duration) * 1000;
        soundCloudWidget.getDuration(function(ms){
          if(Number.isFinite(ms) && ms > 0) soundCloudWidget.seekTo(pct * ms);
        });
      } else if(audio.duration) {
        audio.currentTime = pct * audio.duration;
      }
      fillEl.style.width = (pct*100)+'%'; thumbEl.style.left = (pct*100)+'%';
      curEl.textContent = formatTime(pct * (audio.duration || 0));
      // синхронизируем вторую полосу прогресса (десктоп/мобайл)
      const otherPct = pct*100;
      [progressFill, ppProgressFill].forEach(f => { if(f!==fillEl) f.style.width = otherPct+'%'; });
      [progressThumb, ppProgressThumb].forEach(t => { if(t!==thumbEl) t.style.left = otherPct+'%'; });
      [currentTimeEl, ppCurrentTime].forEach(c => { if(c!==curEl) c.textContent = curEl.textContent; });
      miniProgress.style.width = otherPct + '%';
    }
    function start(clientX){ seeking = true; isSeeking = true; trackEl.classList.add('dragging'); seekTo(clientX); }
    function move(clientX){ if(seeking) seekTo(clientX); }
    function end(){ seeking = false; isSeeking = false; trackEl.classList.remove('dragging'); }

    trackEl.addEventListener('mousedown', e => start(e.clientX));
    window.addEventListener('mousemove', e => move(e.clientX));
    window.addEventListener('mouseup', end);

    trackEl.addEventListener('touchstart', e => start(e.touches[0].clientX), {passive:true});
    trackEl.addEventListener('touchmove', e => move(e.touches[0].clientX), {passive:true});
    trackEl.addEventListener('touchend', end);
  }
  setupSeekableBar(progressTrack, progressFill, progressThumb, currentTimeEl);
  setupSeekableBar(ppProgressTrack, ppProgressFill, ppProgressThumb, ppCurrentTime);

  /* ======================= ГРОМКОСТЬ (только десктоп) ======================= */
  let lastVolume = 0.7;
  audio.volume = lastVolume;
  function setVolumeUI(vol){ volumeFill.style.width=(vol*100)+'%'; volumeThumb.style.left=(vol*100)+'%'; }
  setVolumeUI(lastVolume);

  function setVolume(clientX){
    const rect = volumeTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    if(soundCloudMode && soundCloudWidget && soundCloudReady) soundCloudWidget.setVolume(pct * 100);
    else audio.volume = pct;
    lastVolume = pct;
    setVolumeUI(pct); updateVolumeIcon(pct);
  }
  let isSeekingVolume = false;
  volumeTrack.addEventListener('mousedown', e => { isSeekingVolume = true; setVolume(e.clientX); });
  window.addEventListener('mousemove', e => { if(isSeekingVolume) setVolume(e.clientX); });
  window.addEventListener('mouseup', () => { isSeekingVolume = false; });

  function updateVolumeIcon(vol){
    if(vol === 0){
      volIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><line x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="1.8"/><line x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="1.8"/></svg>';
    } else if(vol < 0.5){
      volIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>';
    } else {
      volIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8.5a4.5 4.5 0 010 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
    }
  }
  let isMuted = false;
  volIcon.addEventListener('click', () => {
    isMuted = !isMuted;
    if(isMuted){
      if(soundCloudMode && soundCloudWidget && soundCloudReady) soundCloudWidget.setVolume(0);
      else audio.volume = 0;
      setVolumeUI(0); updateVolumeIcon(0);
    } else {
      if(soundCloudMode && soundCloudWidget && soundCloudReady) soundCloudWidget.setVolume(lastVolume * 100);
      else audio.volume = lastVolume;
      setVolumeUI(lastVolume); updateVolumeIcon(lastVolume);
    }
  });

  /* ======================= КНОПКИ УПРАВЛЕНИЯ (десктоп + мобайл) ======================= */
  function toggleShuffleUI(){
    isShuffle = !isShuffle;
    [shuffleBtn, ppShuffleBtn].forEach(b => b.classList.toggle('toggled', isShuffle));
  }
  function cycleRepeatUI(){
    repeatMode = (repeatMode + 1) % 3;
    const repeatOneMark = repeatMode === 2;
    [repeatBtn, ppRepeatBtn].forEach(b => {
      b.classList.toggle('toggled', repeatMode !== 0);
      b.querySelector('svg').style.opacity = 1;
    });
    // индикатор "1" для repeat-one
    document.querySelectorAll('#repeatBtn .repeat-one-badge, #ppRepeatBtn .repeat-one-badge').forEach(b=>b.remove());
    if(repeatOneMark){
      [repeatBtn, ppRepeatBtn].forEach(b => {
        const badge = document.createElement('span');
        badge.className = 'repeat-one-badge';
        badge.textContent = '1';
        badge.style.cssText = 'position:absolute;font-size:9px;font-weight:800;margin-left:-6px;margin-top:8px;';
        b.appendChild(badge);
      });
    }
  }

  playBtn.addEventListener('click', togglePlay);
  ppPlayBtn.addEventListener('click', togglePlay);
  miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

  nextBtn.addEventListener('click', () => playNext(true));
  ppNextBtn.addEventListener('click', () => playNext(true));
  prevBtn.addEventListener('click', playPrev);
  ppPrevBtn.addEventListener('click', playPrev);

  shuffleBtn.addEventListener('click', toggleShuffleUI);
  ppShuffleBtn.addEventListener('click', toggleShuffleUI);
  repeatBtn.addEventListener('click', cycleRepeatUI);
  ppRepeatBtn.addEventListener('click', cycleRepeatUI);

  /* ======================= ЛОКАЛЬНЫЕ ФАЙЛЫ ======================= */
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;

    if(!localPlaylist){
      localPlaylist = { id:'local-files', playlistName:'Локальные файлы', coverUrl:null, isLocal:true, tracks:[] };
    }

    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const { title, artist } = parseFileName(file.name);
      // сразу показываем трек с названием из имени файла, а обложку/точные теги
      // подтягиваем асинхронно из самого mp3 (ID3), без ручной прописи ссылок
      const track = { title, artist, coverUrl: null, src: url };
      localPlaylist.tracks.push(track);

      sniffID3(file).then(tags => {
        let changed = false;
        if(tags.title){ track.title = tags.title; changed = true; }
        if(tags.artist){ track.artist = tags.artist; changed = true; }
        if(tags.coverUrl){ track.coverUrl = tags.coverUrl; changed = true; }
        if(changed){
          renderHomeGrid();
          renderLibraryPanel();
          refreshNowPlayingIfCurrent(localPlaylist, track);
        }
      });
    });

    renderHomeGrid();
    renderLibraryPanel();
    fileInput.value = '';
  });

  function parseFileName(filename){
    let name = filename.replace(/\.[^/.]+$/, '');
    const parts = name.split(' - ');
    if(parts.length >= 2){
      return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
    }
    return { artist:'Неизвестный исполнитель', title:name.trim() };
  }

  /* ======================= ИНИЦИАЛИЗАЦИЯ ======================= */
  renderLibraryPanel();
  renderHomeGrid();
  updatePlayUI();

})();
</script>
